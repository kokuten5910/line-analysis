<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>図書館ガチャ</title>

<style>

body{
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
  background:#f2f5f7;
  text-align:center;
  padding:40px;
}

/* ===== 図書カード ===== */

.card{
  width: 100%;
  max-width: 420px;
  margin:auto;
  background:#fffdf5;
  border:3px solid #333;
  border-radius:8px;
  padding:20px;
  box-shadow:5px 5px 0 #999;
  position:relative;
}

/* 図書館ラベル */
.label{
  position:absolute;
  left:-3px;
  top:-3px;
  background:#facc15;
  padding:6px 12px;
  font-weight:bold;
  border-right:3px solid #333;
  border-bottom:3px solid #333;
}

/* 請求記号 */
.callno{
  background:#eee;
  display:inline-block;
  padding:6px 12px;
  border:2px solid #333;
  font-weight:bold;
  margin-bottom:12px;
}

/* タイトル */
.title{
  font-size:22px;
  font-weight:bold;
  margin:10px 0;
}

/* 書誌情報 */
.info{
  text-align:left;
  margin-top:10px;
  line-height:1.6;
}

.desc{
  margin-top:15px;
  border-top:1px dashed #999;
  padding-top:10px;
}

/* ===== スマホ対応（超重要） ===== */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden; /* 横スクロール防止 */
}

/* カード本体 */
.book-card {
  width: 100%;
  max-width: 420px;   /* スマホでちょうど良いサイズ */
  margin: 10px auto;
  padding: 16px;
}

/* 画像は必ず縮む */
.book-card img {
  width: 100%;
  height: auto;
}


/* ===== R演出（青レア）===== */
.r{
  background:linear-gradient(135deg,#e0f2ff,#7dd3fc);
  animation:rareGlow 1.2s infinite alternate;
}

@keyframes rareGlow{
  from{box-shadow:0 0 8px #38bdf8;}
  to{box-shadow:0 0 20px #0ea5e9;}
}

/* ===== SSR演出（金）===== */
.ssr{
  background:linear-gradient(135deg,#fff7b0,#ffd700);
  animation:ssrGlow 1s infinite alternate;
}

@keyframes ssrGlow{
  from{box-shadow:0 0 12px gold;}
  to{box-shadow:0 0 40px gold;}
}

/* ボタン */

button{
  margin-top:25px;
  font-size:18px;
  padding:10px 25px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.spin{
  animation:spin 0.8s linear;
}

@keyframes spin{
  from{transform:rotateY(0);}
  to{transform:rotateY(720deg);}
}
/* キラキラ */
.sparkle{
  position:fixed;
  font-size:22px;
  animation:fall 1.2s linear forwards;
}

@keyframes fall{
  from{transform:translateY(-50px);opacity:1;}
  to{transform:translateY(400px);opacity:0;}
}

</style>
</head>

<body>

<h1>📚 図書館ガチャ</h1>

<div id="card" class="card">
ガチャを回してください
</div>

<button onclick="gacha()">🎰 ガチャを回す</button>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzbiys8J-XDVUwv8OF6PPnEGwgeUYvCpVp7EORsxtH09FoheSvPvDj__ynGseM-3n0z/exec";

let books=[];

async function loadBooks(){
 const res=await fetch(API_URL);
 books=await res.json();
}

function random(arr){
 return arr[Math.floor(Math.random()*arr.length)];
}

function pickBook(){

 const roll=Math.random()*100;

 if(roll<10){
   const ssr=books.filter(b=>b.rarity==="SSR");
   if(ssr.length) return random(ssr);
 }

 if(roll<35){
   const r=books.filter(b=>b.rarity==="R");
   if(r.length) return random(r);
 }

 const n=books.filter(b=>b.rarity==="N");
 return random(n);
}

function gacha(){

/* ===== エフェクト ===== */

function sparkle(count,icon){
 for(let i=0;i<count;i++){
   const s=document.createElement("div");
   s.className="sparkle";
   s.innerHTML=icon;
   s.style.left=Math.random()*window.innerWidth+"px";
   document.body.appendChild(s);
   setTimeout(()=>s.remove(),1200);
 }
}

 const card=document.getElementById("card");

 card.className="card spin";
 card.innerHTML="検索中…";

 setTimeout(()=>{

   const book=pickBook();

   card.className="card";

   // ⭐ レア演出
   if(book.rarity==="R"){
     card.classList.add("r");
     sparkle(8,"⭐");
   }

   // 👑 SSR演出
   if(book.rarity==="SSR"){
     card.classList.add("ssr");
     sparkle(18,"✨");
   }



   card.innerHTML=`

     <div class="label">LIBRARY CARD</div>

     
     
    <br>
 <div class="title"><strong>${book.rarity}（${book.rarityja}）</strong></div>


     <div class="title">${book.title}</div>

     <div class="info">
       ✍ 著者：${book.author}<br>
       🏢 出版社：${book.publisher}<br>
       📂 ジャンル：${book.genre}
    
     <div class="desc">
       ${book.desc}

     </div>

   `;

 },900);
}

loadBooks();

</script>

</body>
</html>
